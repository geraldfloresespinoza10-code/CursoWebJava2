<html lang="es">

<head>

    <style>

        body{

            padding:0;
            font-family:Arial;
            background:#0f172a;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .caja{

            background:white;
            padding:50px;
            border-radius:20px;

            text-align:center;

            width:450px;

            box-shadow:0px 0px 20px rgba(0,0,0,0.4);
        }

        h1{

            color:#4f46e5;
            font-size:40px;
        }

        p{

            font-size:20px;
            color:#374151;
        }

        a{

            display:inline-block;

            margin-top:20px;

            background:#4f46e5;
            color:white;

            padding:15px 25px;

            border-radius:10px;

            text-decoration:none;

            font-weight:bold;
        }

        a:hover{

            background:#3730a3;
        }

    </style>

</head>

<body>

<div class="caja">

    <h1>Gracias 😎</h1>

    <p>
        Gracias por utilizar este programa preciosa hermosa😘.

    <a href="index.html">

</html>
